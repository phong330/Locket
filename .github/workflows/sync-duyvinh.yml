
name: Sync AppPre (Hourly)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-duyvinh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout phong330/Locket
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download latest AppPre source
        run: |
          git clone --depth 1 --branch main \
            https://github.com/dinhduyvinh09/AppPre.git \
            "$RUNNER_TEMP/upstream"

      - name: Sync all source files
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            "$RUNNER_TEMP/upstream/" ./

      - name: Personalize name and keep original destinations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # Change displayed name only; preserve existing link destinations
          html = html.replace(
              ">Đinh Duy Vinh</a>",
              ">phong330</a>"
          )

          # Fix the stale Fake GPS button to match the current AppPre source
          old = (
              "shadowrocket://install?module="
              "https%3A%2F%2Fraw.githubusercontent.com%2Fduyvinh09"
              "%2FModule_IOS%2Frefs%2Fheads%2Fmain"
              "%2Fmodules%2Fios-location-spoofer.sgmodule"
          )

          new = (
              "shadowrocket://install?module="
              "https%3A%2F%2Fcdn.jsdelivr.net%2Fgh%2Fdinhduyvinh09"
              "%2FAppPre%40refs%2Fheads%2Fmain"
              "%2Fmodules%2Fios-location-spoofer.sgmodule"
          )

          html = html.replace(old, new)

          path.write_text(html, encoding="utf-8")
          print("Updated personal display name and Fake GPS link.")
          PY

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi

          git commit -m 'Sync AppPre and personalize display name'
          git push origin HEAD:main
