name: Sync Duy Vinh (Hourly)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-duyvinh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout phong330/Locket
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download latest original source
        run: |
          git clone --depth 1 --branch main https://github.com/duyvinh09/Module_IOS.git "$RUNNER_TEMP/upstream"

      - name: Mirror original files (keep automation itself)
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            "$RUNNER_TEMP/upstream/" ./

      - name: Commit and push only if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi
          git commit -m 'Sync latest files from duyvinh09/Module_IOS'
          git push origin HEAD:main
