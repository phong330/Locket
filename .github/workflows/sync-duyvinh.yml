
name: Sync AppPre (Hourly)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-duyvinh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout phong330/Locket
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download latest source from Vinh
        run: |
          git clone --depth 1 --branch main \
            https://github.com/dinhduyvinh09/AppPre.git \
            "$RUNNER_TEMP/upstream"

      - name: Sync all source files
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            "$RUNNER_TEMP/upstream/" ./

      - name: Change displayed name only
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")

          if path.exists():
              html = path.read_text(encoding="utf-8")
              html = html.replace("Đinh Duy Vinh", "phong330")
              path.write_text(html, encoding="utf-8")
              print("Da doi ten hien thi thanh phong330.")
          else:
              print("Khong tim thay index.html.")
          PY

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi

          git commit -m 'Sync AppPre and change displayed name'
          git push origin HEAD:main
