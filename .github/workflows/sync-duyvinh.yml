
name: Sync AppPre (Hourly)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-duyvinh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download latest source from Vinh
        run: |
          git clone --depth 1 --branch main \
            https://github.com/dinhduyvinh09/AppPre.git \
            "$RUNNER_TEMP/upstream"

      - name: Sync all source files
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            "$RUNNER_TEMP/upstream/" ./

      - name: Add personal label and preserve attribution
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")

          if not path.exists():
              raise SystemExit("Khong tim thay index.html")

          html = path.read_text(encoding="utf-8")

          subtitle = (
              '<p class="text-gray-600" data-i18n="subtitle">'
              'Dành cho iPhone sử dụng ứng dụng '
              '<span class="font-semibold">ShadowRocket</span></p>'
          )

          label = (
              '<p id="personal-brand" '
              'class="text-xs text-gray-500 mt-2">'
              'Bản cá nhân: phong330</p>'
          )

          if 'id="personal-brand"' not in html:
              if subtitle in html:
                  html = html.replace(
                      subtitle,
                      subtitle + "\n" + label,
                      1
                  )
                  print("Da them nhan phong330.")
              else:
                  print("Khong tim thay vi tri chen nhan; giu nguyen HTML.")
          else:
              print("Nhan phong330 da ton tai.")

          path.write_text(html, encoding="utf-8")
          PY

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi

          git commit -m 'Sync AppPre and add personal label'
          git push origin HEAD:main
