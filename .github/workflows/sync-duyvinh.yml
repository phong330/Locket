
name: Sync AppPre (Hourly)

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-duyvinh
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download latest AppPre source
        run: |
          git clone --depth 1 --branch main \
            https://github.com/dinhduyvinh09/AppPre.git \
            "$RUNNER_TEMP/upstream"

      - name: Sync all source files
        run: |
          rsync -a --delete \
            --exclude='/.git/' \
            --exclude='/.github/' \
            "$RUNNER_TEMP/upstream/" ./

      - name: Apply personal website branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          # Fix Fake GPS button to use the new AppPre source
          old_url = (
              "shadowrocket://install?module="
              "https%3A%2F%2Fraw.githubusercontent.com%2Fduyvinh09"
              "%2FModule_IOS%2Frefs%2Fheads%2Fmain"
              "%2Fmodules%2Fios-location-spoofer.sgmodule"
          )

          new_url = (
              "shadowrocket://install?module="
              "https%3A%2F%2Fcdn.jsdelivr.net%2Fgh%2Fdinhduyvinh09"
              "%2FAppPre%40refs%2Fheads%2Fmain"
              "%2Fmodules%2Fios-location-spoofer.sgmodule"
          )

          html = html.replace(old_url, new_url)

          # Add your name under the website heading
          subtitle = (
              '<p class="text-gray-600" data-i18n="subtitle">'
              'Dành cho iPhone sử dụng ứng dụng '
              '<span class="font-semibold">ShadowRocket</span></p>'
          )

          personal_label = (
              '<p class="text-xs text-gray-500 mt-2">'
              'Bản cá nhân: phong330</p>'
          )

          if personal_label not in html and subtitle in html:
              html = html.replace(
                  subtitle, subtitle + "\n" + personal_label, 1
              )

          # Personal footer while retaining source attribution
          old_footer = (
              '© <span id="currentYear">2025</span> '
              '<a href="https://me.momo.vn/dinhduyvinh" '
              'target="_blank" '
              'class="text-blue-600 hover:text-blue-700 hover:underline">'
              'Đinh Duy Vinh</a>. '
              '<span data-i18n="footer-rights">'
              'All rights reserved.</span>'
          )

          new_footer = (
              '© <span id="currentYear">2025</span> phong330 · '
              'Bản cá nhân, mã nguồn từ '
              '<a href="https://github.com/dinhduyvinh09/AppPre" '
              'target="_blank" rel="noopener noreferrer" '
              'class="text-blue-600 hover:text-blue-700 hover:underline">'
              'AppPre</a>.'
          )

          html = html.replace(old_footer, new_footer)

          path.write_text(html, encoding="utf-8")
          print("Da dong bo nguon va ap dung nhan phong330.")
          PY

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add -A

          if git diff --cached --quiet; then
            echo 'Already up to date.'
            exit 0
          fi

          git commit -m 'Sync AppPre source and personalize website'
          git push origin HEAD:main
